<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Browser Data Management Demo</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f2f2f2;
}

.container{
    width:520px;
    margin:40px auto;
    background:white;
    padding:25px;
    border-radius:8px;
    box-shadow:0px 0px 10px #bdbdbd;
}

h2{
    margin-bottom:20px;
}

label{
    display:block;
    margin-top:12px;
    font-size:18px;
}

input,
select,
textarea{
    width:100%;
    padding:8px;
    margin-top:5px;
    box-sizing:border-box;
}

textarea{
    resize:none;
    height:70px;
}

.error{
    color:red;
    font-size:15px;
    margin-top:3px;
}

.buttons{
    margin-top:20px;
}

button{
    padding:10px 15px;
    margin-right:10px;
    cursor:pointer;
}

#storedData{
    margin-top:10px;
    border:1px solid #ccc;
    padding:12px;
    background:white;
}

</style>

</head>

<body>

<div class="container">

<h2>Student Feedback Form</h2>

<label>Name</label>

<input type="text" id="name">

<div id="nameError" class="error"></div>

<label>Email</label>

<input type="email" id="email">

<div id="emailError" class="error"></div>

<label>Course</label>

<select id="course">

<option value="">Select Course</option>
<option>B.Tech AI</option>
<option>B.Tech CSE</option>
<option>BCA</option>
<option>MCA</option>

</select>

<div id="courseError" class="error"></div>

<label>Feedback</label>

<textarea id="feedback"></textarea>

<div id="feedbackError" class="error"></div>

<div class="buttons">

<button onclick="saveFeedback()">Submit Feedback</button>

<button onclick="deleteData()">Delete Stored Data</button>

</div>

<h3>Current Session User:
<span id="sessionUser">None</span>
</h3>

<h2>Stored Feedback</h2>

<div id="storedData">
No feedback stored.
</div>

</div>

<script src="script.js"></script>

</body>
</html>
